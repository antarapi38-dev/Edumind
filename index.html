<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>EduMind AI Chat Interface</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <!-- KaTeX CSS for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#6366F1", // Indigo-500
            secondary: "#10B981", // Emerald-500
            accent: "#FDE047", // Yellow-300
            teal: "#14B8A6", // Teal-500
            "background-light": "#F8FAFC",
            "background-dark": "#0F172A", // Slate-900
            "card-light": "#FFFFFF",
            "card-dark": "#1E293B", // Slate-800
          },
          fontFamily: {
            display: ["Nunito", "sans-serif"],
            body: ["Nunito", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem",
            "3xl": "1.5rem",
            "4xl": "2.5rem",
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.5s ease-out',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            }
          }
        },
      },
    };
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings:
        'FILL' 1,
        'wght' 600,
        'GRAD' 0,
        'opsz' 48
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .dot-pattern {
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }

    .dark .dot-pattern {
      background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "remark-math": "https://esm.sh/remark-math@^6.0.0",
    "rehype-katex": "https://esm.sh/rehype-katex@^7.0.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-background-light dark:bg-background-dark min-h-screen font-display text-slate-800 dark:text-slate-100 flex flex-col items-center p-4 md:p-6 transition-colors duration-300 relative overflow-x-hidden">
  <!-- Replaced body content with minimal wrapper for React -->
  <div id="root" class="w-full flex-1 flex flex-col items-center"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
